
name: CampusBook ZAP Security Scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap_scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Start CampusBook
        run: |
          npm run dev -- --host 0.0.0.0 > /tmp/campusbook.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8443/ > /dev/null; then
              echo "CampusBook is ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/campusbook.log
          exit 1

      - name: Configure Docker access
        run: |
          GATEWAY=$(ip -4 addr show docker0 | awk '/inet / {print $2}' | cut -d/ -f1)
          echo "ZAP_TARGET=http://${GATEWAY}:8443" >> "$GITHUB_ENV"

      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ env.ZAP_TARGET }}
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap_scan
